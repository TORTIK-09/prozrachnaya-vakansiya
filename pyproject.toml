[project]
name = "prozrachnaya-vakansiya"
version = "0.1.0"
description = "Отчёт о понятности вакансий портала «Работа в России» (регион 39)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
