<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прозрачная вакансия</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23173a3a'/%3E%3Ccircle cx='14' cy='14' r='6.5' fill='none' stroke='%23f2b441' stroke-width='2.6'/%3E%3Cpath d='m19 19 6 6' stroke='%23f4efe4' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css?v=5">
</head>
<body>
<header class="top">
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="14" r="7.5" fill="none" stroke="#f2b441" stroke-width="2.6"/><path d="m19.5 19.5 7 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M10.5 14h7M10.5 11h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".8"/></svg>
    <div><h1>Прозрачная вакансия</h1><p>Насколько понятно описаны условия работы · Калининградская область</p></div>
  </div>
  <nav class="nav" aria-label="Разделы"><a href="/" aria-current="page">Отчёт</a><a href="/stats">Статистика</a></nav>
  <span class="chip" id="modelChip"><i></i><span>модель: проверяю…</span></span>
  <button class="icon-btn" id="themeBtn" title="Светлая или тёмная тема" aria-label="Сменить тему">◐</button>
</header>

<div class="bar">
  <div class="seg" role="group" aria-label="Какой отчёт показать">
    <button id="segCheck" aria-pressed="true">Проверочный набор</button>
    <button id="segLatest" aria-pressed="false">Вакансии с портала</button>
  </div>
  <span class="grow"></span>
  <span id="actionsCheck" style="display:contents">
    <button class="btn" id="btnSample"><span class="spin"></span>Проверить учебный набор</button>
    <button class="btn primary" id="btnUpload"><span class="spin"></span>Проверить свой JSON…</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </span>
  <span id="actionsLatest" style="display:none">
    <label class="field">не больше <input type="number" id="maxV" min="1" max="5000" value="200"> вакансий</label>
    <button class="btn primary" id="btnRun"><span class="spin"></span>Загрузить с портала</button>
  </span>
  <a class="btn" id="jsonLink" href="/api/report?kind=check" target="_blank" rel="noopener">JSON отчёта</a>
</div>
<div class="banner" id="banner" role="status"></div>
<div class="runline" id="runline" role="status"><span class="spin"></span><div class="body"><b id="runText"></b><span class="sub" id="runSub"></span><div class="bar2"><u id="runBar" style="width:0"></u></div></div></div>
<div class="notice" id="calib" role="status"><span class="spin"></span><div class="body"><b id="calibTitle"></b><span class="sub" id="calibSub"></span><div class="bar2"><u id="calibBar" style="width:0"></u></div></div><a class="btn" href="/stats" id="calibLink" hidden>Что показала настройка</a><button class="btn" id="calibClose" hidden>Закрыть</button></div>

<section class="summary" aria-label="Сводка по отчёту">
  <div class="stat"><b class="num" id="sTotal">—</b><span>вакансий в отчёте</span></div>
  <div class="stat ok"><b class="num" id="sClean">—</b><span>понятных, без замечаний</span></div>
  <div class="stat warn"><b class="num" id="sBad">—</b><span>нужно уточнить</span></div>
  <div class="stat"><b class="num" id="sFind">—</b><span>замечаний всего</span></div>
  <div class="topics" id="topics" aria-label="Замечания по темам"></div>
</section>

<main class="work">
  <aside class="pane">
    <div class="list-head">
      <input type="search" id="q" placeholder="Поиск по должности, организации, ID" aria-label="Поиск по вакансиям">
      <div class="filters" id="kindFilters"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <section class="pane detail" id="detail"><div class="empty">Выберите вакансию слева</div></section>
</main>

<script src="/static/calib.js?v=3"></script>
<script src="/static/live.js?v=4"></script>
<script>
"use strict";
const TOPICS = {title: "Название должности", duties: "Обязанности", requirements: "Требования", salary: "Оплата", schedule: "График", location: "Место работы", employment: "Тип занятости"};
const KINDS = {contradiction: "противоречие", ambiguous: "неоднозначность", missing: "пропуск"};
const FIELD_NAMES = {"job-name": "Название должности", "duty": "Обязанности", "requirements": "Требования", "qualification": "Квалификация", "requirement.education": "Образование", "requirement.experience": "Опыт, лет", "requirement.qualification": "Требования к квалификации", "salary": "Оплата", "salary_min": "Оплата от", "salary_max": "Оплата до", "term.text": "Премии", "benefit": "Льготы", "schedule": "График", "scheduleTypeComment": "Комментарий к графику", "shift": "Смены", "employment": "Тип занятости", "addresses.address[].location": "Адрес", "conditions": "Условия труда"};
const FIELD_ORDER = Object.keys(FIELD_NAMES);
const fieldName = f => "Поле «" + (FIELD_NAMES[f] || f) + "»";
const ALWAYS = ["job-name", "duty", "requirements", "salary_min", "salary_max", "schedule", "employment", "addresses.address[].location"];
const S = {kind: "check", report: null, sel: null, q: "", fKind: null, fTopic: null, tab: "audit", resumes: [], resumeId: null};
const $ = id => document.getElementById(id);
const put = (node, ...kids) => node.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false));

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
function safeUrl(u) { try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; } }
function plural(n, a, b, c) { const m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; }
function banner(text, info) { const b = $("banner"); b.textContent = text || ""; b.className = "banner" + (text ? " show" : "") + (info ? " info" : ""); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch { /* пустой ответ */ }
  if (!r.ok) { const e = new Error((data && data.detail) || ("Ошибка " + r.status)); e.data = data; throw e; }
  return data;
}
async function busy(btn, fn) {
  btn.classList.add("busy"); btn.disabled = true;
  try { await fn(); } catch (e) { banner(e.message); if (e.data && e.data.report) setReport(e.data.report); } finally { btn.classList.remove("busy"); btn.disabled = false; }
}

function counts(v) { const c = {contradiction: 0, ambiguous: 0, missing: 0}; for (const f of v.findings || []) if (f.kind in c) c[f.kind]++; return c; }
function visible() {
  const q = S.q.trim().toLowerCase();
  return (S.report ? S.report.vacancies : []).filter(v => {
    if (q && !((v.title || "") + " " + (v.company || "") + " " + v.id).toLowerCase().includes(q)) return false;
    const fs = v.findings || [];
    if (S.fKind === "clean") return fs.length === 0;
    if (S.fKind && !fs.some(f => f.kind === S.fKind)) return false;
    if (S.fTopic && !fs.some(f => f.topic === S.fTopic)) return false;
    return true;
  });
}

function setReport(rep) {
  if (LIVE.following && !LIVE.final) return;
  if (!S.report || S.report.partial !== true) LIVE.seen = new Set();     // новый отчёт — список появляется заново
  S.report = rep;
  const vs = rep.vacancies || [];
  if (!vs.some(v => v.id === S.sel)) S.sel = (vs.find(v => (v.findings || []).length) || vs[0] || {}).id || null;
  render();
}
function render() { renderSummary(); renderFilters(); renderList(); renderDetail(); }

function renderSummary() {
  const vs = S.report ? S.report.vacancies : [];
  const bad = vs.filter(v => (v.findings || []).length).length;
  const total = vs.reduce((n, v) => n + (v.findings || []).length, 0);
  setNum("sTotal", S.report ? vs.length : null);
  setNum("sClean", S.report ? vs.length - bad : null);
  setNum("sBad", S.report ? bad : null);
  setNum("sFind", S.report ? total : null);
  const by = {}; let max = 1;
  for (const t in TOPICS) by[t] = {contradiction: 0, ambiguous: 0, missing: 0, n: 0};
  for (const v of vs) for (const f of v.findings || []) if (by[f.topic]) { by[f.topic][f.kind]++; by[f.topic].n++; }
  for (const t in by) max = Math.max(max, by[t].n);
  const box = $("topics");
  if (box.children.length !== Object.keys(TOPICS).length) {
    box.replaceChildren(...Object.keys(TOPICS).map(t => el("button", {class: "topic-row", "data-t": t, title: "Показать вакансии с замечаниями по этой теме",
      onclick: () => { S.fTopic = S.fTopic === t ? null : t; render(); }},
      el("span", {text: TOPICS[t]}),
      el("span", {class: "track"}, ...Object.keys(KINDS).map(k => el("u", {class: "k-" + k, style: "width:0"}))),
      el("span", {class: "num", id: "tn-" + t, text: "0"}))));
    void box.offsetWidth;
  }
  for (const row of box.children) {
    const t = row.dataset.t;
    row.setAttribute("aria-pressed", String(S.fTopic === t));
    Object.keys(KINDS).forEach((k, i) => { row.children[1].children[i].style.width = (by[t][k] / max * 100) + "%"; });
    setNum("tn-" + t, by[t].n);
  }
}
function renderFilters() {
  const opts = [[null, "все"], ["contradiction", "противоречия"], ["ambiguous", "неоднозначности"], ["missing", "пропуски"], ["clean", "понятные"]];
  $("kindFilters").replaceChildren(...opts.map(([k, name]) => el("button", {class: "pill", "aria-pressed": String(S.fKind === k), onclick: () => { S.fKind = k; renderFilters(); renderList(); }},
    k ? el("span", {class: "dot " + k}) : null, name)));
}
function renderList() {
  const vs = visible();
  if (!S.report) return $("list").replaceChildren(el("div", {class: "empty", text: S.kind === "latest" ? "Отчёта по вакансиям с портала ещё нет. Нажмите «Загрузить с портала»." : "Отчёта ещё нет. Нажмите «Проверить учебный набор»."}));
  if (!vs.length) return $("list").replaceChildren(el("div", {class: "empty", text: "Под эти условия вакансий нет"}));
  $("list").replaceChildren(...vs.map(v => {
    const c = counts(v), n = (v.findings || []).length;
    const fresh = !LIVE.seen.has(v.id); LIVE.seen.add(v.id);
    return el("button", {class: "item" + (fresh ? " enter" : "") + (v.pending ? " pending" : ""), "aria-current": String(v.id === S.sel), onclick: () => { S.sel = v.id; S.tab = S.tab === "resume" ? "resume" : "audit"; renderList(); renderDetail(); }},
      el("span", {class: "t", text: v.title || "(без названия)"}),
      el("span", {class: "marks"}, n === 0 ? el("span", {class: "count clean", text: "понятна"}) : Object.keys(KINDS).filter(k => c[k]).map(k => el("span", {class: "count " + k, title: KINDS[k], text: String(c[k])}))),
      el("span", {class: "c", text: [v.company, v.id].filter(Boolean).join(" · ") + (v.pending ? " · проверяет модель" : "")}));
  }));
}

function highlight(text, marks) {
  // marks: [{start, end, kind, idx}] без пересечений; текст вставляется только как текст
  const out = []; let pos = 0;
  for (const m of marks.sort((a, b) => a.start - b.start)) {
    if (m.start < pos) continue;
    if (m.start > pos) out.push(text.slice(pos, m.start));
    out.push(el("mark", {class: m.kind, "data-f": m.idx, title: "Показать замечание", onclick: () => focusFinding(m.idx), text: text.slice(m.start, m.end)}));
    pos = m.end;
  }
  if (pos < text.length) out.push(text.slice(pos));
  return out;
}
function focusFinding(i) {
  document.querySelectorAll(".finding.active, mark.active").forEach(n => n.classList.remove("active"));
  const card = document.querySelector('.finding[data-f="' + i + '"]');
  if (card) { card.classList.add("active"); card.scrollIntoView({block: "nearest", behavior: "smooth"}); }
  document.querySelectorAll('mark[data-f="' + i + '"]').forEach(n => n.classList.add("active"));
}
function copyText(text, btn) {
  const done = () => { const old = btn.textContent; btn.textContent = "скопировано"; setTimeout(() => btn.textContent = old, 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => {}); else done();
}

function renderDetail() {
  const v = S.report && S.report.vacancies.find(x => x.id === S.sel);
  if (!v) return $("detail").replaceChildren(el("div", {class: "empty", text: S.report ? "Выберите вакансию слева" : "Здесь появится разбор вакансии"}));
  const fs = v.findings || [], url = safeUrl(v.url);
  const head = el("div", {class: "d-head"},
    el("div", {}, el("h2", {text: v.title || "(без названия)"}),
      el("div", {class: "sub"}, [v.company, "ID " + v.id].filter(Boolean).join(" · "), url ? " · " : null, url ? el("a", {href: url, target: "_blank", rel: "noopener noreferrer", text: "карточка на портале"}) : null)),
    el("div", {class: "d-actions"}, fs.length ? el("button", {class: "btn", onclick: e => copyText("Вакансия «" + (v.title || v.id) + "»" + (url ? " (" + url + ")" : "") + "\n\n" + fs.map((f, i) => (i + 1) + ". " + f.recommendation).join("\n"), e.currentTarget), text: "Скопировать вопросы работодателю"}) : null));
  const tabs = el("div", {class: "tabs", role: "tablist"},
    el("button", {role: "tab", "aria-selected": String(S.tab === "audit"), onclick: () => { S.tab = "audit"; renderDetail(); }, text: "Разбор вакансии"}),
    el("button", {role: "tab", "aria-selected": String(S.tab === "resume"), onclick: () => { S.tab = "resume"; renderDetail(); }, text: "Резюме под вакансию"}));
  const box = $("detail"), changed = box.dataset.shown !== v.id + "|" + S.tab + "|" + (v.findings || []).length;
  box.dataset.shown = v.id + "|" + S.tab + "|" + (v.findings || []).length;
  box.replaceChildren(head, tabs, S.tab === "resume" ? resumeView(v) : auditView(v));
  if (changed) { box.classList.remove("fade"); void box.offsetWidth; box.classList.add("fade"); }
}

function auditView(v) {
  const fs = v.findings || [], fields = v.fields || {};
  const marksBy = {}, missing = {};
  fs.forEach((f, i) => {
    const pairs = [[f.field, f.quote]]; if (f.conflict_with) pairs.push([f.conflict_with.field, f.conflict_with.quote]);
    for (const [fld, q] of pairs) {
      if (!q) { missing[fld] = i; continue; }
      const text = String(fields[fld] || ""), at = text.indexOf(q);
      if (at >= 0) (marksBy[fld] = marksBy[fld] || []).push({start: at, end: at + q.length, kind: f.kind, idx: i});
    }
  });
  const shown = FIELD_ORDER.filter(f => fields[f] || ALWAYS.includes(f) || f in missing);
  const card = el("dl", {style: "margin:0"}, shown.map(f => {
    const has = fields[f] !== undefined && fields[f] !== "";
    return el("div", {class: "frow" + (has ? "" : " absent")},
      el("dt", {title: "Поле источника: " + f, text: FIELD_NAMES[f]}),
      el("dd", {}, has ? highlight(String(fields[f]), marksBy[f] || []) : (f in missing ? el("span", {class: "gap-flag", style: "cursor:pointer", onclick: () => focusFinding(missing[f]), text: "не указано — см. замечание"}) : "не указано")));
  }));
  const list = fs.length ? fs.map((f, i) => el("article", {class: "finding " + f.kind, "data-f": i, onmouseenter: () => document.querySelectorAll('mark[data-f="' + i + '"]').forEach(n => n.classList.add("active")), onmouseleave: () => document.querySelectorAll("mark.active").forEach(n => n.classList.remove("active"))},
      el("div", {class: "f-top"}, el("span", {class: "kind " + f.kind, text: KINDS[f.kind] || f.kind}), el("span", {class: "f-topic", text: TOPICS[f.topic] || f.topic}),
        el("span", {class: "src" + (f.source === "llm" ? " llm" : ""), title: f.source === "llm" ? "Замечание нашла модель" : "Замечание найдено правилом", text: f.source === "llm" ? "модель" : "правило"})),
      el("div", {text: f.problem}),
      f.quote ? el("div", {class: "quote"}, el("small", {title: "Поле источника: " + f.field, text: fieldName(f.field)}), "«" + f.quote + "»") : el("div", {class: "quote"}, el("small", {title: "Поле источника: " + f.field, text: fieldName(f.field)}), el("span", {class: "gap-flag", text: "поле пустое"})),
      f.conflict_with ? [el("div", {class: "vs", text: "ПРОТИВ"}), el("div", {class: "quote"}, el("small", {title: "Поле источника: " + f.conflict_with.field, text: fieldName(f.conflict_with.field)}), "«" + f.conflict_with.quote + "»")] : null,
      el("div", {class: "rec"}, el("p", {}, el("b", {text: "Что уточнить. "}), f.recommendation), el("button", {class: "copy", onclick: e => copyText(f.recommendation, e.currentTarget), text: "копировать"}))))
    : [el("div", {class: "clean-box", text: "Условия описаны понятно: пропусков, неоднозначностей и противоречий не найдено."})];
  return el("div", {class: "d-body"},
    el("div", {class: "col"}, el("h3", {text: fs.length ? "Замечания · " + fs.length : "Замечания"}), list, v.error ? el("div", {class: "note", text: "Анализ этой вакансии завершился сбоем: " + v.error}) : null),
    el("div", {class: "col"}, el("h3", {text: "Что написано в вакансии"}), card));
}

function resumeView(v) {
  const box = el("div", {class: "resume"});
  const sel = el("select", {"aria-label": "Резюме соискателя", onchange: e => { S.resumeId = e.target.value; load(); }}, S.resumes.map(r => el("option", {value: r.id, selected: r.id === S.resumeId, text: r.label + " · " + r.city})));
  const out = el("div", {style: "display:grid;gap:14px"});
  box.append(el("div", {class: "row"}, el("span", {class: "note", text: "Вымышленное резюме:"}), sel),
    el("div", {class: "note", text: "Черновик собирается только из того, что есть в исходном резюме: навыки и опыт переставляются по близости к вакансии, ничего не дописывается."}), out);
  async function load() {
    if (!S.resumeId) return;
    try {
      const d = await api("/api/resume?resume_id=" + encodeURIComponent(S.resumeId) + "&vacancy_id=" + encodeURIComponent(v.id) + "&kind=" + S.kind, {method: "POST"});
      const dr = d.draft;
      put(out, 
        el("div", {class: "card"}, el("h4", {text: "Совпадение с вакансией"}), el("div", {text: "Навыков из резюме, близких к вакансии: " + d.match.skills_matched + " из " + d.match.skills_total + "; пунктов опыта: " + d.match.duties_matched + "."})),
        el("div", {class: "two"},
          el("div", {class: "card"}, el("h4", {text: "Навыки — сначала близкие к вакансии"}), el("div", {class: "tags"}, dr.skills_first.map(s => el("span", {class: "tag hit", text: s})), dr.skills_other.map(s => el("span", {class: "tag", text: s})))),
          el("div", {class: "card"}, el("h4", {text: "Образование и опыт"}), el("div", {text: dr.education.level + " — " + dr.education.details}), el("div", {class: "note", text: "Опыт работы, лет: " + dr.experience_years}))),
        el("div", {class: "card"}, el("h4", {text: "Опыт работы"}), dr.work.map(w => el("div", {}, el("b", {text: w.role}), " · " + w.company + " · " + w.period, el("ul", {}, w.duties.map((x, i) => el("li", {class: i < w.relevant ? "hit" : "", text: x})))))),
        d.not_confirmed.length ? el("div", {class: "card"}, el("h4", {text: "Чего требует вакансия, а резюме не подтверждает"}), el("ul", {}, d.not_confirmed.map(x => el("li", {text: x})))) : null,
        d.cautions.length ? el("div", {class: "card"}, el("h4", {text: "Противоречия в самой вакансии — уточните до отклика"}), el("ul", {}, d.cautions.map(x => el("li", {text: x})))) : null,
        d.questions_for_employer.length ? el("div", {class: "card"}, el("h4", {text: "Вопросы работодателю до отклика"}), el("ul", {}, d.questions_for_employer.map(x => el("li", {text: x})))) : null,
        el("div", {class: "card"}, el("h4", {text: "Черновик сопроводительного письма"}), el("div", {text: d.cover_letter}), el("div", {style: "margin-top:8px"}, el("button", {class: "copy", onclick: e => copyText(d.cover_letter, e.currentTarget), text: "копировать"}))));
    } catch (e) { out.replaceChildren(el("div", {class: "note", text: e.message})); }
  }
  load();
  return box;
}

async function loadReport() {
  banner("");
  $("jsonLink").href = "/api/report?kind=" + S.kind;
  try { setReport(await api("/api/report?kind=" + S.kind)); }
  catch { S.report = null; S.sel = null; render(); }
}
function switchKind(kind, quiet) {
  S.kind = kind; S.fKind = null; S.fTopic = null; S.q = ""; $("q").value = "";
  $("segCheck").setAttribute("aria-pressed", String(kind === "check")); $("segLatest").setAttribute("aria-pressed", String(kind === "latest"));
  $("actionsCheck").style.display = kind === "check" ? "contents" : "none"; $("actionsLatest").style.display = kind === "latest" ? "contents" : "none";
  $("jsonLink").href = "/api/report?kind=" + kind;
  if (!quiet) return loadReport();
}

$("segCheck").onclick = () => switchKind("check");
$("segLatest").onclick = () => switchKind("latest");
$("q").oninput = e => { S.q = e.target.value; renderList(); };
$("btnSample").onclick = () => startJob("/api/check-sample", {method: "POST"});
$("btnUpload").onclick = () => $("file").click();
$("file").onchange = async e => { const f = e.target.files[0]; if (!f) return; const body = await f.text(); e.target.value = ""; startJob("/api/check?name=" + encodeURIComponent(f.name), {method: "POST", headers: {"Content-Type": "application/json"}, body}); };
$("btnRun").onclick = () => startJob("/api/run?max_vacancies=" + encodeURIComponent($("maxV").value || 200), {method: "POST"});
$("themeBtn").onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; const t = dark ? "light" : "dark"; document.documentElement.dataset.theme = t; try { localStorage.setItem("pv-theme", t); } catch { /* без хранилища */ } };
try { const t = localStorage.getItem("pv-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch { /* без хранилища */ }

(async () => {
  try {
    const st = await api("/api/status");
    $("maxV").value = st.max_vacancies;
    if (st.last_error) banner("Последняя загрузка с портала не удалась: " + st.last_error.error + ". Показан последний успешный отчёт.");
  } catch { /* статус необязателен */ }
  try { S.resumes = await api("/api/resumes"); S.resumeId = (S.resumes[0] || {}).id || null; } catch { /* без сценария */ }
  watchCalibration();
  await loadReport();
  let running = false;
  try { running = (await api("/api/progress")).state === "running"; } catch { /* старый сервис без показа хода */ }
  watchJobs();
  if (!S.report && S.kind === "check" && !running) $("btnSample").click();
})();
</script>
</body>
</html>
