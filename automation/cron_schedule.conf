# ==============================================================================
# Конфигурация Cron для автоматического запуска сервиса «Прозрачная вакансия»
# Регион 39 (Калининградская область) — портал «Работа в России»
#
# Установка в Linux / WSL:
#   crontab automation/cron_schedule.conf
# ==============================================================================

SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

# Запуск рабочего режима каждый час (в 00 минут):
# Загружает вакансии региона 39 (минимум 2 страницы), проверяет с ИИ и сохраняет отчёт в reports/latest_report.json
0 * * * * cd /app && python3 main.py live --max-vacancies 20 --page-limit 10 >> /app/reports/cron_execution.log 2>&1
