# Автоматический прогон тестов на каждый запрос на слияние и на каждую отправку в main.
# Модель тестам не нужна: они работают на подставном клиенте и не обращаются к сети.
name: Тесты

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest
